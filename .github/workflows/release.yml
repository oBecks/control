name: Release

# Pushing a vX.Y.Z tag builds ControlSetup.exe and attaches it to a GitHub release (ADR 0004).
# The tag must match control.__version__ (src/control/__init__.py).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  installer:
    name: Build and publish ControlSetup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[desktop,build]"

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(python -c "import control; print(control.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match control.__version__ ($version)"
            exit 1
          fi

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - run: python packaging/build.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ControlSetup.exe \
            --title "Control ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md --generate-notes --verify-tag
